<div class="flex flex-col md:ml-8 md:flex-row md:justify-end-safe">
  <div class="flex flex-col gap-4 md:flex-row md:w-1/2">
      {% if page.roles %}
      <div class="flex flex-col flex-1 gap-2">
        <h2>Roles</h2>
        <ul>
          {% for role in page.roles %}
            <li>{{ role }}</li>
         {% endfor %}
        </ul>
      </div>
      {% endif %}

      {% if page.deliverables %}
      <div class="flex flex-col flex-1 gap-2">
        <h2>Deliverables</h2>
        <ul>
          {% for deliverable in page.deliverables %}
          <li>{{ deliverable }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}
  </div>
</div>
