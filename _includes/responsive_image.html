{% assign smallest = resized | sort: 'width' | last %}
{% capture srcset %}{% for i in resized %}/{{ i.path }} {{ i.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}{% endcapture %}

<img
  src="/{{ smallest.path }}"
  srcset="{{ srcset }}"
  sizes="(max-width: 968px) 100vw, 968px"
  alt="{{ alt }}"
  {% if title %}title="{{ title }}"{% endif %}
  loading="lazy"
/>
