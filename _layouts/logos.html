---
layout: default
---
<h1 class="font-medium mb-6">{{ page.title }}</h1>
<div class="grid grid-cols-3 gap-4">
  {% assign logo_files = site.static_files | where_exp: "file", "file.path contains '/logos/'" %}
  {% for logo in logo_files %}
    <img src="{{ logo.path }}" alt="Logo" class="w-full">
  {% endfor %}
</div>
